name: Build APK desde ZIP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el ZIP
        run: |
          mkdir -p proyecto
          unzip -o IAJugadora.zip -d proyecto
          DIR=$(dirname "$(find proyecto -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IAJugadora-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
